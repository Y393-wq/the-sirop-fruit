<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Sirop Fruit</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff7d6, #ffe0b2);
      color: #222;
      text-align: center;
    }

    header {
      background: linear-gradient(135deg, #ff7b00, #ffb300);
      color: white;
      padding: 35px 20px;
      border-radius: 0 0 30px 30px;
    }

    header h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
    }

    .intro {
      background: white;
      padding: 25px;
      border-radius: 25px;
      margin-bottom: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    .intro h2 {
      color: #ff7100;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .flavors {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .flavor {
      background: white;
      border-radius: 25px;
      padding: 25px 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.12);
      transition: transform 0.2s;
    }

    .flavor:hover {
      transform: translateY(-5px);
    }

    .fruit {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .flavor h3 {
      color: #ff7100;
      font-size: 22px;
    }
